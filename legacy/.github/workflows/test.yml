name: Host and Simulator Tests

on:
  push:
    paths:
      - "project/**"
      - "tests/**"
      - "app/**"
      - "docs/**"
      - ".devcontainer/create_boot.py"
      - ".devcontainer/common_functions.sh"
      - ".github/workflows/**"
      - "requirements.txt"
      - "pytest.ini"
  pull_request:
    paths:
      - "project/**"
      - "tests/**"
      - "app/**"
      - "docs/**"
      - ".devcontainer/create_boot.py"
      - ".devcontainer/common_functions.sh"
      - ".github/workflows/**"
      - "requirements.txt"
      - "pytest.ini"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q tests

  simulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
        working-directory: app
      - run: npm test -- --runInBand
        working-directory: app
      - run: node app/scripts/stage-site.js _site
