<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Robot Config | THS Comp</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="css/style.css?v=8" />
  </head>
  <body class="bg-dark text-light config-page">
    <nav class="navbar navbar-dark bg-primary">
      <div class="container-fluid gap-2">
        <a class="navbar-brand" href="index.html"
          ><i class="bi bi-robot me-2"></i>THS Comp</a
        >
        <a
          class="nav-link text-white"
          id="backToMain"
          href="simulator.html?challenge=1"
          ><i class="bi bi-arrow-left me-2"></i>Main &amp; Simulator</a
        >
      </div>
    </nav>
    <main class="container-fluid py-3">
      <div class="config-toolbar border-bottom border-secondary pb-3 mb-2">
        <h1 class="h5 mb-0"><i class="bi bi-sliders me-2"></i>config.py</h1>
        <label class="visually-hidden" for="configSection"
          >Configuration section</label
        >
        <select
          class="form-select form-select-sm bg-dark text-light border-secondary"
          id="configSection"
          aria-label="Configuration section"
        ></select>
        <div
          class="btn-group btn-group-sm"
          role="group"
          aria-label="Configuration tools"
        >
          <button
            class="btn btn-outline-light"
            id="foldConfig"
            title="Fold sections"
            aria-label="Fold sections"
          >
            <i class="bi bi-arrows-collapse"></i>
          </button>
          <button
            class="btn btn-outline-light"
            id="expandConfig"
            title="Expand sections"
            aria-label="Expand sections"
          >
            <i class="bi bi-arrows-expand"></i>
          </button>
          <button
            class="btn btn-outline-light"
            id="importConfig"
            title="Import config.py"
            aria-label="Import config.py"
          >
            <i class="bi bi-upload"></i>
          </button>
          <button
            class="btn btn-outline-light"
            id="downloadConfig"
            title="Download config.py"
            aria-label="Download config.py"
          >
            <i class="bi bi-download"></i>
          </button>
          <button
            class="btn btn-outline-warning"
            id="resetConfig"
            title="Reset shared config"
            aria-label="Reset shared config"
          >
            <i class="bi bi-arrow-counterclockwise"></i>
          </button>
        </div>
        <button class="btn btn-sm btn-success" id="validateConfig">
          <i class="bi bi-check2-circle me-1"></i>Validate
        </button>
        <span class="small text-info" id="configSaveStatus" role="status"
          >Loading...</span
        >
      </div>
      <div
        id="configEditor"
        class="border border-secondary"
        aria-label="Python configuration editor"
      ></div>
      <div
        id="configResult"
        class="small mt-2"
        role="status"
        aria-live="polite"
      ></div>
      <input
        id="configFile"
        type="file"
        accept=".py,text/x-python,text/plain"
        hidden
      />
    </main>
    <div
      class="modal fade"
      id="resetConfigModal"
      tabindex="-1"
      aria-labelledby="resetConfigTitle"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content bg-dark text-light border-secondary">
          <div class="modal-header border-secondary">
            <h2 class="modal-title h5" id="resetConfigTitle">
              Reset Shared Config?
            </h2>
            <button
              class="btn-close btn-close-white"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            Replace all shared tuning with the baseline? Your main programs will
            not change.
          </div>
          <div class="modal-footer border-secondary">
            <button class="btn btn-secondary" data-bs-dismiss="modal">
              Cancel
            </button>
            <button class="btn btn-warning" id="confirmResetConfig">
              <i class="bi bi-arrow-counterclockwise me-1"></i>Reset Config
            </button>
          </div>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/ace-builds@1.32.2/src-min-noconflict/ace.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/ace-builds@1.32.2/src-min-noconflict/mode-python.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/ace-builds@1.32.2/src-min-noconflict/theme-monokai.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt-stdlib.js"></script>
    <script src="js/config-store.js?v=1"></script>
    <script src="js/config-editor.js?v=1"></script>
  </body>
</html>
